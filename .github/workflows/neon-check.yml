name: Neon version check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  neon:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: CI database image matches Neon's major version
        run: |
          neon_major=$(( $(psql "$DATABASE_URL" -tAc 'SHOW server_version_num') / 10000 ))
          ci_major=$(sed -n 's/.*image: postgres:\([0-9]*\).*/\1/p' .github/workflows/ci.yml)
          echo "Neon: $neon_major, CI container: $ci_major"
          if [ "$neon_major" != "$ci_major" ]; then
            echo "::error::Neon is on Postgres $neon_major but ci.yml tests against $ci_major; bump the image in ci.yml"
            exit 1
          fi
